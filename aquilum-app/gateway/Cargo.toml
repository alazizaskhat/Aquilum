[package]
name = "aquilum-gateway"
version = "0.2.0"
edition = "2024"
publish = false
description = "Small authenticated, read-only REST gateway for a local Aquilum workspace"

[features]
default = ["standalone"]
standalone = ["dep:reqwest", "dep:rmcp", "dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "aquilum-gateway"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.7", optional = true, default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "fs", "signal"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["fmt"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
